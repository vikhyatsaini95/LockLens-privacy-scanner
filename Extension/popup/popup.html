<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LockLens</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="popup-shell" aria-labelledby="appTitle">
<div class="cyber-grid" aria-hidden="true"></div><div class="orb orb-one" aria-hidden="true"></div><div class="orb orb-two" aria-hidden="true"></div>
<header class="brand"><div class="shield-mark" aria-hidden="true"><span>L</span></div><div><p class="eyebrow">PRIVACY INTELLIGENCE</p><h1 id="appTitle">LockLens</h1></div><span class="live-dot" title="Local protection online"></span></header><p class="tagline">Your digital footprint, in focus.</p>
<section class="privacy-box" aria-label="Privacy promise"><span class="privacy-icon" aria-hidden="true">⌁</span><div><strong>Privacy-first analysis</strong><span>Local metadata only · no raw data stored</span></div><span class="secure-check" aria-hidden="true">✓</span></section>
<section class="scan-readout" aria-label="Scanner status"><span class="readout-label">SCANNER</span><span id="scanState">READY</span><span class="scan-pulse" aria-hidden="true"></span></section>
<button id="scanButton" class="primary-button" type="button"><span class="button-icon" aria-hidden="true">◉</span><span>Analyze This Page</span><span class="scan-lines" aria-hidden="true"></span></button>
<button id="privacyGuardButton" class="secondary-button guard-toggle" type="button" aria-pressed="false"><span class="button-icon" aria-hidden="true">◈</span><span>Enable Privacy Guard</span></button><p id="guardStatus" class="guard-status" role="status" aria-live="polite">Privacy Guard is currently off.</p>
<button id="dashboardButton" class="secondary-button dashboard-button" type="button"><span>Open Intelligence Center</span><span aria-hidden="true">→</span></button><p id="status" class="status" role="status" aria-live="polite">Ready to analyze this page.</p><p class="device-note">Analysis happens locally on your device.</p>
</main><script src="../scripts/scanner.js"></script><script src="../scripts/riskEngine.js"></script><script src="../scripts/recommendationEngine.js"></script><script src="../scripts/timeline.js"></script><script src="popup.js"></script></body></html>
